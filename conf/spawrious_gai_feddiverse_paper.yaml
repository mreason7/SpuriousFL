defaults:
  - job/federated_training@_here_
  - machine: env
  - client_opt: all_defaults
  - server_opt: all_defaults
  - model_options: mobilenet
  - dataset_options: spawrious
  - override hydra/launcher: basic
  - _self_

hydra:
  mode: RUN
  job:
    chdir: false

# This seed controls the client data split.
# Training RNG follows the released official code behavior.
seed: 42

client_opt:
  learning_rate: 0.001
  batch_size: 28
  epochs: 1

  # Final defaults in the released official source.
  biased_trainer_steps: 50
  left_right_trainer_steps: 10
  generalized_cross_entropy_q: 0.3
  biased_optimizer: ReSample

model_options:
  model_type: MobileNet
  norm_layer: gn
  pretrained: true

server_opt:
  # 201 Flower events but 200 model updates:
  # 1 FedAvg pre-training, 1 DHT-only round,
  # and 199 FedDiverse/FedAvgM updates.
  rounds: 201
  optimizer: FedAvgM
  learning_rate: 0.1
  beta_1: 0.95

  participation: selection
  selection_method: triplets_stochasticmatrix
  num_active_clients: 9
  weight_clients: same
  client_info: triplets_Npredicted

  paper_faithful_pretrain: true
  pretrain_rounds: 1
  dht_collection_rounds: 1
  update_static_info_rounds: 0

dataset_options:
  name: Spawrious
  input_size: 224
  num_targets: 2
  num_groups: 2
  norm: true
  aug_crop: 0
  aug_horizontal_flip: false
  num_samples_per_class: null

  # The released README maps the 25-client paper GAI experiment to GAI_2.
  split_mode: spawrious_GAI_2
  num_clients: 25

  locations: ['beach', 'snow', 'desert', 'jungle', 'mountain', 'dirt']
  breeds: ['labrador', 'dachshund', 'bulldog', 'corgi']

checkpoint: null
wandb: false
